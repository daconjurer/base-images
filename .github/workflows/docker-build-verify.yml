name: Verify Docker images (build, no push)

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'python-for-ci/**'
      - 'rust-for-ci/**'
      - 'golang-for-ci/**'
      - 'node-for-ci/**'
      - 'ci-docker-client/**'
      - '.github/workflows/docker-build-verify.yml'
      - '.github/workflows/reusable-docker-build-verify.yml'
  workflow_dispatch:
    description: Manually trigger image build verification without requiring path changes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed image stacks
    runs-on: ubuntu-latest
    outputs:
      python_for_ci: ${{ steps.filter.outputs.python_for_ci }}
      rust_for_ci: ${{ steps.filter.outputs.rust_for_ci }}
      golang_for_ci: ${{ steps.filter.outputs.golang_for_ci }}
      node_for_ci: ${{ steps.filter.outputs.node_for_ci }}
      ci_docker_client: ${{ steps.filter.outputs.ci_docker_client }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python_for_ci:
              - 'python-for-ci/**'
            rust_for_ci:
              - 'rust-for-ci/**'
            golang_for_ci:
              - 'golang-for-ci/**'
            node_for_ci:
              - 'node-for-ci/**'
            ci_docker_client:
              - 'ci-docker-client/**'

  python-for-ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: "3.12"
            python_image_digest: sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36
          - python_version: "3.13"
            python_image_digest: sha256:9662417aace5ae7b8e2609cce472b72a8958e134ba372808abe9cc1a0c0125e6
          - python_version: "3.14"
            python_image_digest: sha256:a7fb1e634c4a578f9e0bd6327f11a3cde11b7a9395f48e24360c0988bcc5c2bc
    needs: changes
    if: needs.changes.outputs.python_for_ci == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-docker-build-verify.yml
    with:
      name: Build python-for-ci (${{ matrix.python_version }})
      context: python-for-ci
      dockerfile: python-for-ci/Dockerfile
      platforms: linux/amd64,linux/arm64
      build_args: |
        PYTHON_VERSION=${{ matrix.python_version }}
        PYTHON_IMAGE_DIGEST=${{ matrix.python_image_digest }}
        UV_VERSION=0.11.21
        JUST_VERSION=1.52.0

  rust-for-ci:
    strategy:
      fail-fast: false
      matrix:
        rust_version: ["1.85"]
    needs: changes
    if: needs.changes.outputs.rust_for_ci == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-docker-build-verify.yml
    with:
      name: Build rust-for-ci (${{ matrix.rust_version }})
      context: rust-for-ci
      dockerfile: rust-for-ci/Dockerfile
      platforms: linux/amd64,linux/arm64
      build_args: |
        RUST_VERSION=${{ matrix.rust_version }}

  rust-for-ci-frontend:
    strategy:
      fail-fast: false
      matrix:
        rust_version: ["1.85"]
    needs: changes
    if: needs.changes.outputs.rust_for_ci == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-docker-build-verify.yml
    with:
      name: Build rust-for-ci-frontend (${{ matrix.rust_version }})
      context: rust-for-ci
      dockerfile: rust-for-ci/Dockerfile.frontend
      platforms: linux/amd64,linux/arm64
      build_args: |
        RUST_VERSION=${{ matrix.rust_version }}
        NODE_VERSION=20.18.0
        PNPM_VERSION=9.15.0
        TRUNK_VERSION=0.21.14

  golang-for-ci:
    needs: changes
    if: needs.changes.outputs.golang_for_ci == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-docker-build-verify.yml
    with:
      name: Build golang-for-ci
      context: golang-for-ci
      dockerfile: golang-for-ci/Dockerfile
      platforms: linux/amd64,linux/arm64
      build_args: |
        TASK_VERSION=v3.49.1
        GOLANGCI_LINT_VERSION=2.12.2

  node-for-ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - node_version: "20"
            node_image_digest: sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
          - node_version: "22"
            node_image_digest: sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436
    needs: changes
    if: needs.changes.outputs.node_for_ci == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-docker-build-verify.yml
    with:
      name: Build node-for-ci (${{ matrix.node_version }})
      context: node-for-ci
      dockerfile: node-for-ci/Dockerfile
      platforms: linux/amd64,linux/arm64
      build_args: |
        NODE_VERSION=${{ matrix.node_version }}
        NODE_IMAGE_DIGEST=${{ matrix.node_image_digest }}
        JUST_VERSION=1.52.0
        PNPM_VERSION=10.32.1

  ci-docker-client:
    needs: changes
    if: needs.changes.outputs.ci_docker_client == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-docker-build-verify.yml
    with:
      name: Build ci-docker-client
      context: ci-docker-client
      dockerfile: ci-docker-client/Dockerfile
      platforms: linux/amd64,linux/arm64
      build_args: |
        DOCKER_CLI_VERSION=27.5.1
        COMPOSE_VERSION=2.32.4
