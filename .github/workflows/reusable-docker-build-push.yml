name: Reusable Docker build & push (buildx)

on:
  workflow_call:
    inputs:
      context:
        description: Dockerfile build context directory (repository-relative path)
        type: string
        required: false
        default: .
      dockerfile:
        description: Path to Dockerfile (repository-relative path)
        type: string
        required: true
      image_name:
        description: >-
          Repository name segment on Docker Hub; image is pushed as <DOCKER_USERNAME>/<image_name>.
        type: string
        required: true
      tags:
        description: One tag suffix per line (e.g. 3.12-latest). Fully qualified refs are appended automatically.
        type: string
        required: true
      platforms:
        description: Target platforms passed to docker buildx (comma-separated)
        type: string
        required: false
        default: linux/amd64,linux/arm64
      build_args:
        description: Optional Dockerfile build-args, one VAR=value per line
        type: string
        required: false
        default: ""
      docker_client_tag:
        description: >-
          When set, appends DOCKER_CLIENT_IMAGE=<DOCKER_USERNAME>/ci-docker-client:<tag>
          as a build-arg (secrets are not available in caller workflow inputs).
        type: string
        required: false
        default: ""

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: base

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose registry tags
        id: refs
        env:
          DOCKER_IMG: ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}
          GHCR_IMG: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          RAW: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          docker_tags=""
          ghcr_tags=""

          while IFS= read -r line || [ -n "$line" ]; do
            tag="$(printf '%s' "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$tag" ] && continue

            docker_ref="${DOCKER_IMG}:${tag}"
            ghcr_ref="${GHCR_IMG}:${tag}"

            if [ -z "$docker_tags" ]; then
              docker_tags="${docker_ref}"
              ghcr_tags="${ghcr_ref}"
            else
              docker_tags="${docker_tags}"$'\n'"${docker_ref}"
              ghcr_tags="${ghcr_tags}"$'\n'"${ghcr_ref}"
            fi
          done <<< "$RAW"

          if [ -z "$docker_tags" ]; then
            echo "inputs.tags resolved to zero non-empty tags" >&2
            exit 1
          fi

          delim="$(uuidgen)"
          {
            printf 'tags<<%s\n' "$delim"
            printf '%s\n' "$docker_tags"
            printf '%s\n' "$ghcr_tags"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Compose build args
        id: build_args
        env:
          RAW: ${{ inputs.build_args }}
          TAG: ${{ inputs.docker_client_tag }}
          USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          out="$RAW"
          if [ -n "$TAG" ]; then
            line="DOCKER_CLIENT_IMAGE=${USER}/ci-docker-client:${TAG}"
            if [ -z "$out" ]; then
              out="$line"
            else
              out="${out}"$'\n'"${line}"
            fi
          fi

          delim="$(uuidgen)"
          {
            printf 'args<<%s\n' "$delim"
            printf '%s\n' "$out"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.refs.outputs.tags }}
          build-args: ${{ steps.build_args.outputs.args }}
