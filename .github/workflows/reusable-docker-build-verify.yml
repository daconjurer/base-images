name: Reusable Docker build verify (buildx, no push)

on:
  workflow_call:
    inputs:
      context:
        description: Dockerfile build context directory (repository-relative path)
        type: string
        required: false
        default: .
      dockerfile:
        description: Path to Dockerfile (repository-relative path)
        type: string
        required: true
      platforms:
        description: Target platforms passed to docker buildx (comma-separated)
        type: string
        required: false
        default: linux/amd64,linux/arm64
      build_args:
        description: Optional Dockerfile build-args, one VAR=value per line
        type: string
        required: false
        default: ""

jobs:
  build:
    name: Build (no push)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: false
          build-args: ${{ inputs.build_args }}
