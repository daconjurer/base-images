name: Build golang-for-ci (validation)

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'golang-for-ci/**'
      - '.github/workflows/golang-for-ci-build.yml'
      - '.github/workflows/reusable-docker-build-verify.yml'
  workflow_dispatch:
    description: Manually trigger build and verification without path changes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golang-for-ci:
    name: Build & verify golang-for-ci
    uses: ./.github/workflows/reusable-docker-build-verify.yml
    with:
      context: golang-for-ci
      dockerfile: golang-for-ci/Dockerfile
      platforms: linux/amd64,linux/arm64
