name: Publish Docker Hub images

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed image stacks
    runs-on: ubuntu-latest
    outputs:
      python_for_ci: ${{ steps.filter.outputs.python_for_ci }}
      rust_for_ci: ${{ steps.filter.outputs.rust_for_ci }}
      golang_for_ci: ${{ steps.filter.outputs.golang_for_ci }}
      ci_docker_client: ${{ steps.filter.outputs.ci_docker_client }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python_for_ci:
              - 'python-for-ci/**'
            rust_for_ci:
              - 'rust-for-ci/**'
            golang_for_ci:
              - 'golang-for-ci/**'
            ci_docker_client:
              - 'ci-docker-client/**'

  python-for-ci:
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.12", "3.13", "3.14"]
    name: Build & push python-for-ci (${{ matrix.python_version }})
    needs: changes
    if: needs.changes.outputs.python_for_ci == 'true'
    uses: ./.github/workflows/reusable-docker-build-push.yml
    secrets: inherit
    with:
      context: python-for-ci
      dockerfile: python-for-ci/Dockerfile
      image_name: python-for-ci
      platforms: linux/amd64,linux/arm64
      tags: |
        ${{ matrix.python_version }}-${{ github.sha }}
        ${{ matrix.python_version }}-latest
      build_args: |
        PYTHON_VERSION=${{ matrix.python_version }}
      docker_client_tag: 27.5.1-2.32.4-latest

  rust-for-ci:
    strategy:
      fail-fast: false
      matrix:
        rust_version: ["1.85"]
    name: Build & push rust-for-ci (${{ matrix.rust_version }})
    needs: changes
    if: needs.changes.outputs.rust_for_ci == 'true'
    uses: ./.github/workflows/reusable-docker-build-push.yml
    secrets: inherit
    with:
      context: rust-for-ci
      dockerfile: rust-for-ci/Dockerfile
      image_name: rust-for-ci
      platforms: linux/amd64,linux/arm64
      tags: |
        ${{ matrix.rust_version }}-${{ github.sha }}
        ${{ matrix.rust_version }}-latest
      build_args: |
        RUST_VERSION=${{ matrix.rust_version }}
      docker_client_tag: 27.5.1-2.32.4-latest

  golang-for-ci:
    name: Build & push golang-for-ci
    needs: changes
    if: needs.changes.outputs.golang_for_ci == 'true'
    uses: ./.github/workflows/reusable-docker-build-push.yml
    secrets: inherit
    with:
      context: golang-for-ci
      dockerfile: golang-for-ci/Dockerfile
      image_name: golang-for-ci
      platforms: linux/amd64,linux/arm64
      tags: |
        1.25.0-${{ github.sha }}
        1.25.0-latest
      docker_client_tag: 27.5.1-2.32.4-latest

  ci-docker-client:
    name: Build & push ci-docker-client
    needs: changes
    if: needs.changes.outputs.ci_docker_client == 'true'
    uses: ./.github/workflows/reusable-docker-build-push.yml
    secrets: inherit
    with:
      context: ci-docker-client
      dockerfile: ci-docker-client/Dockerfile
      image_name: ci-docker-client
      platforms: linux/amd64,linux/arm64
      tags: |
        27.5.1-2.32.4-${{ github.sha }}
        27.5.1-2.32.4-latest
      build_args: |
        DOCKER_CLI_VERSION=27.5.1
        COMPOSE_VERSION=2.32.4
