name: Publish Docker Hub images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    description: Manually trigger image build and push to Docker Hub and GHCR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed image stacks
    runs-on: ubuntu-latest
    outputs:
      python_for_ci: ${{ steps.filter.outputs.python_for_ci }}
      rust_for_ci: ${{ steps.filter.outputs.rust_for_ci }}
      golang_for_ci: ${{ steps.filter.outputs.golang_for_ci }}
      node_for_ci: ${{ steps.filter.outputs.node_for_ci }}
      ci_docker_client: ${{ steps.filter.outputs.ci_docker_client }}
      ros2_for_ci: ${{ steps.filter.outputs.ros2_for_ci }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python_for_ci:
              - 'python-for-ci/**'
            rust_for_ci:
              - 'rust-for-ci/**'
            golang_for_ci:
              - 'golang-for-ci/**'
            node_for_ci:
              - 'node-for-ci/**'
            ci_docker_client:
              - 'ci-docker-client/**'
            ros2_for_ci:
              - 'ros2-for-ci/**'

  python-for-ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: "3.12"
            python_image_digest: sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36
          - python_version: "3.13"
            python_image_digest: sha256:9662417aace5ae7b8e2609cce472b72a8958e134ba372808abe9cc1a0c0125e6
          - python_version: "3.14"
            python_image_digest: sha256:a7fb1e634c4a578f9e0bd6327f11a3cde11b7a9395f48e24360c0988bcc5c2bc
    needs: changes
    if: needs.changes.outputs.python_for_ci == 'true'
    uses: ./.github/workflows/reusable-docker-build-push.yml
    secrets: inherit
    with:
      name: Build & push python-for-ci (${{ matrix.python_version }})
      context: python-for-ci
      dockerfile: python-for-ci/Dockerfile
      image_name: python-for-ci
      platforms: linux/amd64,linux/arm64
      tags: |
        ${{ matrix.python_version }}-${{ github.sha }}
        ${{ matrix.python_version }}-latest
      build_args: |
        PYTHON_VERSION=${{ matrix.python_version }}
        PYTHON_IMAGE_DIGEST=${{ matrix.python_image_digest }}
        UV_VERSION=0.11.21
        JUST_VERSION=1.52.0
      docker_client_tag: 27.5.1-2.32.4-latest

  rust-for-ci:
    strategy:
      fail-fast: false
      matrix:
        rust_version: ["1.85"]
    needs: changes
    if: needs.changes.outputs.rust_for_ci == 'true'
    uses: ./.github/workflows/reusable-docker-build-push.yml
    secrets: inherit
    with:
      name: Build & push rust-for-ci (${{ matrix.rust_version }})
      context: rust-for-ci
      dockerfile: rust-for-ci/Dockerfile
      image_name: rust-for-ci
      platforms: linux/amd64,linux/arm64
      tags: |
        ${{ matrix.rust_version }}-${{ github.sha }}
        ${{ matrix.rust_version }}-latest
      build_args: |
        RUST_VERSION=${{ matrix.rust_version }}
      docker_client_tag: 27.5.1-2.32.4-latest

  rust-for-ci-frontend:
    strategy:
      fail-fast: false
      matrix:
        rust_version: ["1.85"]
    needs: changes
    if: needs.changes.outputs.rust_for_ci == 'true'
    uses: ./.github/workflows/reusable-docker-build-push.yml
    secrets: inherit
    with:
      name: Build & push rust-for-ci-frontend (${{ matrix.rust_version }})
      context: rust-for-ci
      dockerfile: rust-for-ci/Dockerfile.frontend
      image_name: rust-for-ci-frontend
      platforms: linux/amd64,linux/arm64
      tags: |
        ${{ matrix.rust_version }}-${{ github.sha }}
        ${{ matrix.rust_version }}-latest
      build_args: |
        RUST_VERSION=${{ matrix.rust_version }}
        NODE_VERSION=20.18.0
        PNPM_VERSION=9.15.0
        TRUNK_VERSION=0.21.14

  golang-for-ci:
    needs: changes
    if: needs.changes.outputs.golang_for_ci == 'true'
    uses: ./.github/workflows/reusable-docker-build-push.yml
    secrets: inherit
    with:
      name: Build & push golang-for-ci
      context: golang-for-ci
      dockerfile: golang-for-ci/Dockerfile
      image_name: golang-for-ci
      platforms: linux/amd64,linux/arm64
      tags: |
        1.26.3-${{ github.sha }}
        1.26.3-latest
      build_args: |
        TASK_VERSION=v3.49.1
        GOLANGCI_LINT_VERSION=2.12.2
      docker_client_tag: 27.5.1-2.32.4-latest

  node-for-ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - node_version: "20"
            node_image_digest: sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
          - node_version: "22"
            node_image_digest: sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436
    needs: changes
    if: needs.changes.outputs.node_for_ci == 'true'
    uses: ./.github/workflows/reusable-docker-build-push.yml
    secrets: inherit
    with:
      name: Build & push node-for-ci (${{ matrix.node_version }})
      context: node-for-ci
      dockerfile: node-for-ci/Dockerfile
      image_name: node-for-ci
      platforms: linux/amd64,linux/arm64
      tags: |
        ${{ matrix.node_version }}-${{ github.sha }}
        ${{ matrix.node_version }}-latest
      build_args: |
        NODE_VERSION=${{ matrix.node_version }}
        NODE_IMAGE_DIGEST=${{ matrix.node_image_digest }}
        JUST_VERSION=1.52.0
        PNPM_VERSION=10.32.1
      docker_client_tag: 27.5.1-2.32.4-latest

  ci-docker-client:
    needs: changes
    if: needs.changes.outputs.ci_docker_client == 'true'
    uses: ./.github/workflows/reusable-docker-build-push.yml
    secrets: inherit
    with:
      name: Build & push ci-docker-client
      context: ci-docker-client
      dockerfile: ci-docker-client/Dockerfile
      image_name: ci-docker-client
      platforms: linux/amd64,linux/arm64
      tags: |
        27.5.1-2.32.4-${{ github.sha }}
        27.5.1-2.32.4-latest
      build_args: |
        DOCKER_CLI_VERSION=27.5.1
        COMPOSE_VERSION=2.32.4

  ros2-for-ci:
    needs: changes
    if: needs.changes.outputs.ros2_for_ci == 'true'
    uses: ./.github/workflows/reusable-docker-build-push.yml
    secrets: inherit
    with:
      name: Build & push ros2-for-ci
      context: ros2-for-ci
      dockerfile: ros2-for-ci/Dockerfile
      image_name: ros2-for-ci
      platforms: linux/amd64,linux/arm64
      tags: |
        lyrical-${{ github.sha }}
        lyrical-latest
      build_args: |
        ROS_DISTRO=lyrical
        POETRY_VERSION=2.1.1
