stages: [build, publish]

include:
  - component: $CI_SERVER_FQDN/vs-software/ci/ci-components/container-image@main
    inputs:
      image_path: python-for-ci
      context: python-for-ci/
      dockerfile: python-for-ci/Dockerfile
      language_version: "3.12"
      version_build_arg: PYTHON_VERSION
  - component: $CI_SERVER_FQDN/vs-software/ci/ci-components/container-image@main
    inputs:
      image_path: rust-for-ci
      context: rust-for-ci/
      dockerfile: rust-for-ci/Dockerfile
      language_version: "1.85"
      version_build_arg: RUST_VERSION
  - component: $CI_SERVER_FQDN/vs-software/ci/ci-components/container-image@main
    inputs:
      image_path: golang-for-ci
      context: golang-for-ci/
      dockerfile: golang-for-ci/Dockerfile
      language_version: "1.26.3"
      version_build_arg: GO_VERSION
